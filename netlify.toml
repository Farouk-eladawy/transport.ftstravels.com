# Netlify — frontend only (transport.ftstravels.com)
# Backend on Railway: https://transport-ftstravels.up.railway.app

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Set in Netlify UI → Site settings → Environment variables:
# NEXT_PUBLIC_FTS_STANDALONE = true  (default — no ilicense.tech; set false only for vendor builds)
# NEXT_PUBLIC_API_URL = https://transport-ftstravels.up.railway.app
# NEXT_PUBLIC_ENABLE_CAR_DISPATCH = true
# (no trailing slash — do NOT append /api)
